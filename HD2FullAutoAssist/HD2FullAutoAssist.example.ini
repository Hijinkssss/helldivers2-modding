# Copy to %LOCALAPPDATA%/CowboyBingus/Helldivers2/HD2FullAutoAssist.ini
enabled = true
user_enabled = true
# 0 uses the selected policy interval. Positive milliseconds only slow it down.
repeat_ms = 0
toggle_hotkey = F8
debug_logging = false
validation_logging = false
# balanced: min(native cap, 380 RPM), except provisional AMR 120 RPM.
# native_cap: per-weapon cap; snapshot caps still need accepted-shot validation.
fire_rate_mode = balanced
