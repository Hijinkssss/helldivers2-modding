# Copy to %LOCALAPPDATA%/CowboyBingus/Helldivers2/HD2FullAutoAssist.ini
enabled = true
user_enabled = true
# 0 uses the selected policy interval. Positive milliseconds only slow it down.
repeat_ms = 0
toggle_hotkey = =
debug_logging = false
validation_logging = false
# Developer-only profiling; summary is buffered in memory and logged on unload.
performance_profile = false
performance_label = unlabeled
# balanced: min(native cap, 380 RPM), except AMR 120 and Talon profile below.
# native_cap: per-weapon cap; input attempts are not guaranteed accepted shots.
fire_rate_mode = balanced
# Talon: balanced (about 210 RPM, estimated 8 shots to overheat),
# efficiency (60), full_auto (380), or fuller_auto (750).
talon_mode = balanced
# Optional per-weapon fallback profiles. Applied/saved in-game menu choices win.
# Legacy Arsenal option addons, if present, seed missing menu choices over INI.
# The private replacement package needs only Core; no option addon is required.
# Accepted modes: peacemaker_profile=balanced|full_auto
# socom_profile=balanced|full_auto; veto_profile=balanced|full_auto
# talon_profile=balanced|efficiency|full_auto|fuller_auto
# amr_profile=balanced|full_auto
# commando_profile=balanced|full_auto (Balanced 120, Full Auto 240)
# hyena_profile=balanced|full_auto (Balanced 120, Full Auto 190)
# bushwhacker_profile=balanced|full_auto (Balanced 90, Full Auto 650)
# eruptor_profile=slower_27|balanced_28|max_32
# Eruptor defaults to Balanced 28 RPM, including legacy native_cap mode.
# Old RC1 cadence selections migrate to the corresponding new option.
# Optional HUD diagnostics: at most 120 records; synchronous I/O is excluded by default.
hud_diagnostics = false
# Legacy compatibility setting. The enlarged force-visible probe is no longer used.
hud_probe_visible = false

# Per-weapon defaults and fallback settings used when Mod Options Menu is absent.
# With the in-game menu, saved menu values take precedence and apply immediately.
# Omitted keys default to true. Global = OFF always disables all assistance.
